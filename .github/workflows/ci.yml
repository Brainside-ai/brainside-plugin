name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned by commit SHA (tag in parentheses) so the tag cannot be swapped underneath us.
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # JSON, manifests, .mcp.json (single address), skill frontmatter, no hooks/agents/bin,
      # exact brainside-ai/... path in the texts. Builds dist/brainside-skill.zip. Standard library only.
      - name: Validate and build the skill ZIP
        run: python3 .github/scripts/validate.py

      - name: Upload the skill ZIP (v4.6.2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brainside-skill
          path: dist/brainside-skill.zip
          if-no-files-found: error
          retention-days: 30
