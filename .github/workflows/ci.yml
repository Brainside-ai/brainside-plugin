name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned by commit SHA (the release tag is in the step name).
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Allowlists for files, manifest keys, addresses, commands and characters; safe SVG;
      # the single MCP address; semantic version with a CHANGELOG entry. Builds dist/brainside-skill.zip.
      - name: Validate and build the skill ZIP
        run: python3 .github/scripts/validate.py .

      # A pull request may change the validator, so main's copy also checks the pull request's tree.
      # A pull request can change this workflow too, so changes under .github/ still need a careful read.
      - name: Validate with the validator from main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:.github/scripts/validate.py > "$RUNNER_TEMP/v.py"
          if grep -q '^ACCEPTS_ROOT_ARGUMENT = True$' "$RUNNER_TEMP/v.py"; then
            python3 "$RUNNER_TEMP/v.py" .
          else
            # Transition: a validator from before the ROOT argument finds the repository from its own
            # location, so it runs from that location inside an export of the pull request's tree.
            tree="$RUNNER_TEMP/tree"
            mkdir -p "$tree"
            git archive HEAD | tar -x -C "$tree"
            cp "$RUNNER_TEMP/v.py" "$tree/.github/scripts/validate.py"
            python3 "$tree/.github/scripts/validate.py"
          fi

      # People get a change to the plugin only through a new version, so a pull request that changes
      # the plugin or the marketplace must raise the version in plugin.json above main's.
      - name: Require a new version when the plugin changes
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if git diff --quiet origin/main HEAD -- plugins/ .claude-plugin/; then
            echo "The plugin and the marketplace are unchanged; no new version needed."
            exit 0
          fi
          git show origin/main:plugins/brainside/.claude-plugin/plugin.json > "$RUNNER_TEMP/main-plugin.json"
          python3 - "$RUNNER_TEMP/main-plugin.json" plugins/brainside/.claude-plugin/plugin.json <<'EOF'
          import json, re, sys
          old, new = (json.load(open(p, encoding="utf-8"))["version"] for p in sys.argv[1:3])
          core = lambda v: tuple(int(x) for x in re.match(r"(\d+)\.(\d+)\.(\d+)", v).groups())
          if new == old or core(new) < core(old):
              print(f"::error::The plugin changed, but plugin.json still has version {new} "
                    f"(main has {old}). Raise the version and add a CHANGELOG entry.")
              sys.exit(1)
          print(f"Version {old} on main -> {new} in this pull request.")
          EOF

      - name: Upload the skill ZIP (actions/upload-artifact v7.0.2)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: brainside-skill
          path: dist/brainside-skill.zip
          if-no-files-found: error
          retention-days: 30
